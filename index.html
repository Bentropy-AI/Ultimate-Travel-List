<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Travel List</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-wrapper">

  <nav class="site-nav">
    <div class="nav-inner"></div>
  </nav>

  <header class="page-hero">
    <h1>&#9992; Ultimate Travel List</h1>
    <p>Track travel achievements across the whole family</p>
  </header>

  <main>
    <div class="container">

      <section class="section">
        <h2 class="section-title">Family Overview</h2>
        <div class="stats-grid" id="globalStats">
          <div class="stat-card">
            <span class="stat-number" id="statCountries">&#8212;</span>
            <span class="stat-label">Countries</span>
          </div>
          <div class="stat-card">
            <span class="stat-number" id="statAnimals">&#8212;</span>
            <span class="stat-label">Animals</span>
          </div>
          <div class="stat-card">
            <span class="stat-number" id="statUnesco">&#8212;</span>
            <span class="stat-label">UNESCO Sites</span>
          </div>
          <div class="stat-card">
            <span class="stat-number" id="statPeaks">&#8212;</span>
            <span class="stat-label">County Peaks</span>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">Travellers</h2>
        <div class="grid" id="travellerCards">
          <p class="loading-msg">Loading...</p>
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <p>Ultimate Travel List &copy; 2026 &mdash; Built for the family, by the family.</p>
  </footer>

  <script src="js/travel.js"></script>
  <script>
    var app = window.TravelApp;
    app.renderNav('home');
    app.loadAllData().then(function(data) {
      var travellers = data.travellers;
      var countries  = data.countries;
      var animals    = data.animals;
      var unesco     = data.unesco;
      var peaks      = data.peaks;

      document.getElementById('statCountries').textContent = countries.length;
      document.getElementById('statAnimals').textContent   = animals.length;
      document.getElementById('statUnesco').textContent    = unesco.length;
      document.getElementById('statPeaks').textContent     = peaks.length;

      var grid = document.getElementById('travellerCards');
      var html = '';
      for (var i = 0; i < travellers.length; i++) {
        var t = travellers[i];
        var cVisited = (t.countries || []).length;
        var p = countries.length ? Math.round((cVisited / countries.length) * 100) : 0;
        html += '<a class="card-link" href="pages/' + t.id + '.html">' +
          '<div class="card traveller-' + t.id + '">' +
            '<h3 style="color:' + t.color + '">' + t.emoji + ' ' + t.name + '<\/h3>' +
            '<p style="margin-bottom:.5rem">View travel progress<\/p>' +
            '<div style="font-size:.78rem;color:var(--color-muted);margin-bottom:.25rem">' +
              cVisited + ' / ' + countries.length + ' countries' +
            '<\/div>' +
            '<div class="progress-wrap">' +
              '<div class="progress-bar">' +
                '<div class="progress-fill ' + t.id + '" style="width:' + p + '%"><\/div>' +
              '<\/div>' +
            '<\/div>' +
          '<\/div>' +
        '<\/a>';
      }
      grid.innerHTML = html || '<p class="empty-msg">No traveller data found.<\/p>';
    }).catch(function(err) {
      console.error('Failed to load data:', err);
      document.getElementById('travellerCards').innerHTML =
        '<p class="empty-msg">Could not load data.<\/p>';
    });
  </script>

</body>
</html>
