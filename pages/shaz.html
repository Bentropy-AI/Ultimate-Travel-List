      <style>

      <script>
      (function(){var SCRIPTS=['https://cdn.amcharts.com/lib/5/index.js','https://cdn.amcharts.com/lib/5/map.js','https://cdn.amcharts.com/lib/5/geodata/worldLow.js'];var NAME_MAP={'Bosnia':'BA','UAE':'AE','UK':'GB','USA':'US','Wales':'GB','St Lucia':'LC','Trinidad':'TT','French Polynesia':'PF','Hong Kong':'HK','Cayman Islands':'KY','New Caledonia':'NC','Puerto Rico':'PR','Reunion':'RE','Antarctica':null,'Argentina/Brazil':['AR','BR'],'Canada/USA':['CA','US'],'France/Italy':['FR','IT'],'Israel/Jordan':['IL','JO'],'Zimbabwe/Zambia':['ZW','ZM'],'Abu Dhabi':'AE','England':'GB','Northern Ireland':'GB','Scotland':'GB','Bosnia-Herzegovina':'BA','Aruba':'AW','Republic of Congo':'CG','Reunion Island':'RE'};var W={country:0.35,capital:0.15,tl1:0.25,tl2:0.25};function resolveISOs(c,bn){if(NAME_MAP.hasOwnProperty(c)){var m=NAME_MAP[c];if(!m)return[];return Array.isArray(m)?m:[m];}return bn[c]?[bn[c]]:[]; }function lerp(c1,c2,t){var r1=(c1>>16)&255,g1=(c1>>8)&255,b1=c1&255,r2=(c2>>16)&255,g2=(c2>>8)&255,b2=c2&255;return(Math.round(r1+(r2-r1)*t)<<16)|(Math.round(g1+(g2-g1)*t)<<8)|Math.round(b1+(b2-b1)*t);}function getColor(p){var C0=0x1a1530,C1=0x4a1a98,C2=0x7a3ad4,C3=0x9b59f5;if(p<=0)return C0;if(p<=33)return lerp(C0,C1,p/33);if(p<=66)return lerp(C1,C2,(p-33)/33);return lerp(C2,C3,(p-66)/34);}function buildMap(t1,t2,countries,unescoItems,person){var bn={};countries.forEach(function(c){bn[c.name]=c.id;});var vU={};(person.unesco||[]).forEach(function(x){vU[x]=1;});var uByISO={};(unescoItems||[]).forEach(function(item){var cns=item.country.split(',');cns.forEach(function(cn){cn=cn.trim();var iso=bn[cn];if(iso){if(!uByISO[iso])uByISO[iso]={total:0,visited:0};uByISO[iso].total++;if(vU[item.id])uByISO[iso].visited++;}});});var vC={},vCap={},vT1={},vT2={};(person.countries||[]).forEach(function(x){vC[x]=1;});(person.capitals||[]).forEach(function(x){vCap[x]=1;});(person.travellist1||[]).forEach(function(x){vT1[x]=1;});(person.travellist2||[]).forEach(function(x){vT2[x]=1;});var m1={},m2={};t1.forEach(function(i){resolveISOs(i.country,bn).forEach(function(iso){if(!m1[iso])m1[iso]={total:0,visited:0};m1[iso].total++;if(vT1[i.id])m1[iso].visited++;});});t2.forEach(function(i){resolveISOs(i.country,bn).forEach(function(iso){if(!m2[iso])m2[iso]={total:0,visited:0};m2[iso].total++;if(vT2[i.id])m2[iso].visited++;});});var result={};countries.forEach(function(c){var iso=c.id,cv=!!vC[iso],cap=!!vCap[iso],t1c=m1[iso]||{total:0,visited:0},t2c=m2[iso]||{total:0,visited:0};var w={country:W.country,capital:W.capital,tl1:W.tl1,tl2:W.tl2};if(!t1c.total&&!t2c.total){w={country:.70,capital:.30,tl1:0,tl2:0};}else if(!t1c.total){w={country:.47,capital:.20,tl1:0,tl2:.33};}else if(!t2c.total){w={country:.47,capital:.20,tl1:.33,tl2:0};}var pct=Math.round(((cv?w.country:0)+(cap?w.capital:0)+(t1c.total?(t1c.visited/t1c.total)*w.tl1:0)+(t2c.total?(t2c.visited/t2c.total)*w.tl2:0))*100);result[iso]={pct:pct,cv:cv,cap:cap,t1v:t1c.visited,t1t:t1c.total,t2v:t2c.visited,t2t:t2c.total,uv:(uByISO[iso]||{}).visited||0,ut:(uByISO[iso]||{}).total||0,name:c.name,capital:c.capital};});return result;}function renderMap(cm){var am5=window.am5,am5map=window.am5map,geo=window.am5geodata_worldLow;if(!am5||!am5map||!geo)return;if(window._shazMapRoot){window._shazMapRoot.dispose();}var root=am5.Root.new('map-wrap');window._shazMapRoot=root;root.setThemes([]);var chart=root.container.children.push(am5map.MapChart.new(root,{panX:'rotateX',panY:'translateY',projection:am5map.geoNaturalEarth1(),paddingLeft:0,paddingRight:0,paddingTop:0,paddingBottom:0}));chart.chartContainer.set('background',am5.Rectangle.new(root,{fill:am5.color(0x0f1117),fillOpacity:1}));var series=chart.series.push(am5map.MapPolygonSeries.new(root,{geoJSON:geo,exclude:['AQ']}));var tt=am5.Tooltip.new(root,{getFillFromSprite:false,autoTextColor:false,background:am5.RoundedRectangle.new(root,{fill:am5.color(0x1a1d27),fillOpacity:.97,stroke:am5.color(0x2e3350),strokeWidth:1,cornerRadiusTL:6,cornerRadiusTR:6,cornerRadiusBL:6,cornerRadiusBR:6})});tt.label.setAll({fill:am5.color(0xe8eaf0),fontSize:12});series.mapPolygons.template.setAll({interactive:true,strokeWidth:.4,stroke:am5.color(0x0f1117),tooltip:tt});series.mapPolygons.template.adapters.add('tooltipText',function(text,target){var id=target.dataItem&&target.dataItem.get('id');if(!id)return text;var d=cm[id];var label=d?d.name:(target.dataItem.get('name')||id);if(!d){return '[bold]'+label+'[/] [#7a7f9a]not yet visited[/]';}var pct=d.pct;var pc=pct>=75?'#3ecf8e':pct>=40?'#f59e0b':'#9b59f5';var ck=function(v){return v?'[#3ecf8e]✔[/]':'[#7a7f9a]✘[/]';};var fr=function(v,t){return t?('[bold]'+v+'/'+t+'[/]'):'[#7a7f9a]-[/]';};var sep='[#2e3350] | [/]';return '[bold #e8eaf0 fontSize:13]'+label+'[/][#7a7f9a fontSize:11] • '+d.capital+'[/]'+''+'[#555a7a]——————————[/]'+''+'[#7a7f9a fontSize:11]Completion [/][bold '+pc+' fontSize:12]'+pct+'%[/]'+''+'[#7a7f9a fontSize:11]Visited [/]'+ck(d.cv)+sep+'[#7a7f9a fontSize:11]Capital [/]'+ck(d.cap)+''+'[#7a7f9a fontSize:11]TL I [/]'+fr(d.t1v,d.t1t)+sep+'[#7a7f9a fontSize:11]TL II [/]'+fr(d.t2v,d.t2t)+''+'[#7a7f9a fontSize:11]UNESCO [/]'+fr(d.uv,d.ut);});series.mapPolygons.template.states.create('hover',{strokeWidth:1.5,stroke:am5.color(0xffffff),strokeOpacity:.7});series.events.on('datavalidated',function(){series.mapPolygons.each(function(p){var id=p.dataItem&&p.dataItem.get('id');if(!id)return;var d=cm[id];var pct=d?d.pct:undefined;p.set('fill',am5.color(getColor(pct!==undefined?pct:0)));});});}function loadScripts(urls,cb){if(!urls.length){cb();return;}var s=document.createElement('script');s.src=urls[0];s.onload=function(){loadScripts(urls.slice(1),cb);};s.onerror=function(){console.error('Failed: '+urls[0]);};document.head.appendChild(s);}var rp=(window.location.pathname.indexOf('/pages/')!==-1)?'../':'./';function fj(f){return fetch(rp+'data/'+f).then(function(r){return r.json();});}loadScripts(SCRIPTS,function(){Promise.all([fj('travellist1.json'),fj('travellist2.json'),fj('countries.json'),fj('unesco.json')]).then(function(res){var person={};var cached=localStorage.getItem('utl_store_v2');if(cached){try{person=JSON.parse(cached).shaz||{};}catch(e){}}var cm=buildMap(res[0],res[1],res[2],res[3],person);renderMap(cm);if(window.TravelApp&&window.TravelApp.Store){window.TravelApp.Store.onSave(function(){var c2=localStorage.getItem('utl_store_v2');if(c2){try{person=JSON.parse(c2).shaz||{};}catch(e){}}cm=buildMap(res[0],res[1],res[2],res[3],person);renderMap(cm);});}});});}());
      </script>
      <style>
        #cc-section{margin-top:0}
        .cc-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:1.2rem}
        .cc-search{flex:1;min-width:180px;max-width:300px;padding:8px 14px;background:var(--color-surface2);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:.9rem;outline:none;transition:border-color var(--transition)}

        .cc-table thead tr{background:var(--color-surface2)}

        .cc-table th:hover{color:var(--color-text)}

        .cc-table th.sort-desc::after{content:' ▼';color:var(--color-shaz)}
        .cc-table tbody tr{border-bottom:1px solid var(--color-border);transition:background var(--transition)}
        .cc-table tbody tr:last-child{border-bottom:none}
        .cc-table tbody tr:hover{background:var(--color-surface2)}

        .cc-summary-line{font-size:.82rem;color:var(--color-muted);margin-bottom:1rem}

      </style>
      <section class="section" id="cc-section">

      </section>
      <script>
      (function(){var NAME_MAP={'Bosnia':'BA','UAE':'AE','UK':'GB','USA':'US','Wales':'GB','St Lucia':'LC','Trinidad':'TT','French Polynesia':'PF','Hong Kong':'HK','Cayman Islands':'KY','New Caledonia':'NC','Puerto Rico':'PR','Reunion':'RE','Antarctica':null,'Argentina/Brazil':['AR','BR'],'Canada/USA':['CA','US'],'France/Italy':['FR','IT'],'Israel/Jordan':['IL','JO'],'Zimbabwe/Zambia':['ZW','ZM'],'Abu Dhabi':'AE','England':'GB','Northern Ireland':'GB','Scotland':'GB','Bosnia-Herzegovina':'BA','Aruba':'AW','Republic of Congo':'CG','Reunion Island':'RE'};var W={country:0.35,capital:0.15,tl1:0.25,tl2:0.25};var sortCol='name',sortDir='asc',curFilter='all',curSearch='';var _rows=[];function resolveISOs(c,byName){if(NAME_MAP.hasOwnProperty(c)){var m=NAME_MAP[c];if(!m)return[];return Array.isArray(m)?m:[m];}return byName[c]?[byName[c]]:[]; }function buildRows(tl1Items,tl2Items,countries,personData){var vC={},vCap={},vT1={},vT2={};(personData.countries||[]).forEach(function(x){vC[x]=1;});(personData.capitals||[]).forEach(function(x){vCap[x]=1;});(personData.travellist1||[]).forEach(function(x){vT1[x]=1;});(personData.travellist2||[]).forEach(function(x){vT2[x]=1;});var byName={};countries.forEach(function(c){byName[c.name]=c.id;});var m1={},m2={};tl1Items.forEach(function(item){resolveISOs(item.country,byName).forEach(function(iso){if(!m1[iso])m1[iso]={total:0,visited:0};m1[iso].total++;if(vT1[item.id])m1[iso].visited++;});});tl2Items.forEach(function(item){resolveISOs(item.country,byName).forEach(function(iso){if(!m2[iso])m2[iso]={total:0,visited:0};m2[iso].total++;if(vT2[item.id])m2[iso].visited++;});});var rows=[];countries.forEach(function(c){var iso=c.id,cv=!!vC[iso],cap=!!vCap[iso];var t1=m1[iso]||{total:0,visited:0},t2=m2[iso]||{total:0,visited:0};var w={country:W.country,capital:W.capital,tl1:W.tl1,tl2:W.tl2};if(!t1.total&&!t2.total){w={country:0.70,capital:0.30,tl1:0,tl2:0};}else if(!t1.total){w={country:0.47,capital:0.20,tl1:0,tl2:0.33};}else if(!t2.total){w={coun
