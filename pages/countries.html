<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countries &amp; Capitals — Ultimate Travel List</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="page-wrapper">
  <nav class="site-nav"><div class="nav-inner"></div></nav>
  <header class="page-hero">
    <h1>&#127757; Countries &amp; Capitals</h1>
    <p>Track visited countries worldwide</p>
  </header>
  <main>
    <div class="container">
      <section class="section">
        <h2 class="section-title">Country Progress by Traveller</h2>
        <div id="countriesTable"><p class="loading-msg">Loading...</p></div>
      </section>
    </div>
  </main>
  <footer class="site-footer"><p>Ultimate Travel List &copy; 2026</p></footer>
  <script src="../js/travel.js"></script>
  <script>
    var app = window.TravelApp;
    app.renderNav('countries');
    app.loadAllData().then(function(data) {
      var travellers = data.travellers;
      var countries  = data.countries;
      var colours = { ben: '#4f8ef7', shaz: '#9b59f5', paul: '#3ecf8e', ruth: '#e05c8e' };
      var ct = [];
      for (var i=0; i<travellers.length; i++) {
        var t = travellers[i];
        ct.push({ id: t.id, name: t.name, color: colours[t.id]||'#fff', countries: t.countries||[] });
      }
      app.renderComparisonTable({
        container: document.getElementById('countriesTable'),
        masterList: countries,
        travellers: ct,
        category: 'countries',
        labelFn: function(i) { return i.name + (i.capital ? ' — ' + i.capital : ''); },
        groupFn: function(i) { return i.continent; }
      });
    }).catch(function(err) { console.error(err); });
  </script>
</body>
</html>
