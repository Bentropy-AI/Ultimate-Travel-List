<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animals — Ultimate Travel List</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="page-wrapper">
  <nav class="site-nav"><div class="nav-inner"></div></nav>
  <header class="page-hero">
    <h1>&#128006; Animals</h1>
    <p>Iconic wildlife species spotted in the wild</p>
  </header>
  <main>
    <div class="page-hero" style="border-top:none;padding:4rem 1.25rem 5rem">
      <div style="font-size:3.5rem;margin-bottom:1rem">&#128679;</div>
      <h2 style="font-size:clamp(1.4rem,3vw,2rem);font-weight:800;letter-spacing:-0.02em;margin-bottom:0.6rem">Coming Soon</h2>
      <p style="color:var(--color-muted);font-size:1rem;max-width:420px;margin:0 auto">This page is under construction and will be available shortly.</p>
    </div>
  </main>
  <footer class="site-footer"><p>Ultimate Travel List &copy; 2026</p></footer>
  <script src="../js/travel.js"></script>
  <script>
    window.TravelApp.renderNav('animals');
  </script>

  <!-- Auth Login Modal -->
  <div id="auth-modal-backdrop">
    <div id="auth-modal">
      <h3>&#128275; Edit Mode</h3>
      <p>Enter the password to enable editing</p>
      <input type="password" id="auth-password-input" placeholder="Password..." autocomplete="current-password">
      <div id="auth-error"></div>
      <div class="auth-modal-btns">
        <button id="auth-cancel-btn" onclick="document.getElementById('auth-modal-backdrop').classList.remove('open')">Cancel</button>
        <button id="auth-submit-btn">Unlock</button>
      </div>
    </div>
  </div>
  <script>
    function showLoginModal() {
      document.getElementById('auth-modal-backdrop').classList.add('open');
      document.getElementById('auth-password-input').value = '';
      document.getElementById('auth-error').textContent = '';
      setTimeout(function(){ document.getElementById('auth-password-input').focus(); }, 50);
    }
    document.addEventListener('DOMContentLoaded', function() {
      var submitBtn = document.getElementById('auth-submit-btn');
      var input = document.getElementById('auth-password-input');
      function tryLogin() {
        var pw = input.value;
        if (!pw) return;
        submitBtn.textContent = '...';
        authLogin(pw, function(ok) {
          if (ok) {
            document.getElementById('auth-modal-backdrop').classList.remove('open');
            window.location.reload();
          } else {
            document.getElementById('auth-error').textContent = 'Incorrect password';
            submitBtn.textContent = 'Unlock';
            input.value = '';
            input.focus();
          }
        });
      }
      submitBtn.addEventListener('click', tryLogin);
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });
    });
  </script>
</body>
</html>
