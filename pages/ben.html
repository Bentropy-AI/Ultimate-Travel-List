<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben - Travel Progress</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="page-wrapper">
  <nav class="site-nav"><div class="nav-inner"></div></nav>
  <main>
    <div class="container">
      <div class="person-hero">
        <div class="person-avatar avatar-ben">B</div>
        <h1 style="color:var(--color-ben)">Ben</h1>
        <p style="color:var(--color-muted)">Travel Progress</p>
      </div>
      <section class="section">
        <h2 class="section-title">Summary</h2>
        <div class="stats-grid" id="pStats"><p class="loading-msg">Loading...</p></div>
      </section>

    <!-- ============================================================
         COUNTRY COMPLETION TABLE
         Weightings: Country 35% | Capital 15% | TL1 25% | TL2 25%
         ============================================================ -->
    <style>
      #cc-section{margin-top:0}
      .cc-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:1.2rem}
      .cc-search{flex:1;min-width:180px;max-width:300px;padding:8px 14px;background:var(--color-surface2);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:.9rem;outline:none;transition:border-color var(--transition)}
      .cc-search:focus{border-color:var(--color-primary)}
      .cc-filters{display:flex;flex-wrap:wrap;gap:6px}
      .cc-table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--color-border)}
      .cc-table{width:100%;border-collapse:collapse;font-size:.875rem;min-width:760px}
      .cc-table thead tr{background:var(--color-surface2)}
      .cc-table th{padding:11px 14px;text-align:left;color:var(--color-muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:2px solid var(--color-border);transition:color var(--transition)}
      .cc-table th:hover{color:var(--color-text)}
      .cc-table th.sort-asc::after{content:' ▲';color:var(--color-primary)}
      .cc-table th.sort-desc::after{content:' ▼';color:var(--color-primary)}
      .cc-table tbody tr{border-bottom:1px solid var(--color-border);transition:background var(--transition)}
      .cc-table tbody tr:last-child{border-bottom:none}
      .cc-table tbody tr:hover{background:var(--color-surface2)}
      .cc-table td{padding:10px 14px;color:var(--color-text);white-space:nowrap}
      .cc-table td.cc-cname{font-weight:500}
      .cc-tick{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:.75rem;font-weight:700}
      .cc-tick.yes{background:rgba(62,207,142,.15);color:var(--color-success)}
      .cc-tick.no{background:rgba(122,127,154,.12);color:var(--color-muted)}
      .cc-frac{font-variant-numeric:tabular-nums}
      .cc-frac.zero{color:var(--color-muted)}
      .cc-frac.partial{color:var(--color-warning)}
      .cc-frac.complete{color:var(--color-success)}
      .cc-bar-cell{min-width:160px}
      .cc-bar-wrap{display:flex;align-items:center;gap:10px}
      .cc-bar-track{flex:1;height:8px;background:var(--color-border);border-radius:4px;overflow:hidden}
      .cc-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#2563c4,var(--color-ben));transition:width .4s ease}
      .cc-bar-fill.high{background:linear-gradient(90deg,#1a7a4a,var(--color-success))}
      .cc-bar-fill.medium{background:linear-gradient(90deg,#b07a10,var(--color-warning))}
      .cc-bar-fill.low{background:linear-gradient(90deg,#8a2a2a,var(--color-danger))}
      .cc-pct{font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums;width:36px;text-align:right}
      .cc-cont-badge{display:inline-block;padding:2px 8px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:500;background:var(--color-surface2);color:var(--color-muted);border:1px solid var(--color-border)}
      .cc-summary-line{font-size:.82rem;color:var(--color-muted);margin-bottom:1rem}
      .cc-no-results{text-align:center;padding:2rem;color:var(--color-muted)}
    </style>

    <section class="section" id="cc-section">
      <h2 class="section-title">🗺️ Country Completion</h2>
      <p class="cc-summary-line" id="cc-summary-line"></p>
      <div class="cc-controls">
        <input class="cc-search search-input" type="search" placeholder="Search country…" id="cc-search">
        <div class="cc-filters" id="cc-filter-btns">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="visited">Visited</button>
          <button class="filter-btn" data-filter="unvisited">Not Yet</button>
          <button class="filter-btn" data-filter="Africa">Africa</button>
          <button class="filter-btn" data-filter="Asia">Asia</button>
          <button class="filter-btn" data-filter="Europe">Europe</button>
          <button class="filter-btn" data-filter="North America">North America</button>
          <button class="filter-btn" data-filter="Oceania">Oceania</button>
          <button class="filter-btn" data-filter="South America">South America</button>
        </div>
      </div>
      <div class="cc-table-wrap">
        <table class="cc-table" id="cc-table">
          <thead>
            <tr>
              <th data-col="continent">Continent</th>
              <th data-col="name">Country</th>
              <th data-col="countryVisited" title="Has Ben visited this country?">Visited</th>
              <th data-col="capital">Capital</th>
              <th data-col="capitalVisited" title="Has Ben visited the capital?">Capital ✓</th>
              <th data-col="tl1" title="Travel List I items visited">Travel List I</th>
              <th data-col="tl2" title="Travel List II items visited">Travel List II</th>
              <th data-col="completion" class="sort-desc">Completion</th>
            </tr>
          </thead>
          <tbody id="cc-tbody"></tbody>
        </table>
      </div>
    </section>
    </div>
  </main>
  <footer class="site-footer"><p>Ultimate Travel List &copy; 2026</p></footer>
  <script src="../js/travel.js"></script>
  <script>
    var app = window.TravelApp;
    var PERSON = "ben";
    app.renderNav(PERSON);
    app.loadAllData().then(function(data) {
      var travellers = data.travellers;
      var countries  = data.countries;
      var animals    = data.animals;
      var unesco     = data.unesco;
      var tl1        = data.tl1;
      var tl2        = data.tl2;
      var t = null;
      for (var i = 0; i < travellers.length; i++) {
        if (travellers[i].id === PERSON) { t = travellers[i]; break; }
      }
      if (!t) t = {};
      document.getElementById("pStats").innerHTML =
        app.buildStatCard((t.travellist1||[]).length, "/ " + tl1.length + " Travel List I") +
        app.buildStatCard((t.travellist2||[]).length, "/ " + tl2.length + " Travel List II") +
        app.buildStatCard((t.countries||[]).length,   "/ " + countries.length + " Countries") +
        app.buildStatCard((t.capitals||[]).length,    "/ " + countries.length + " Capitals") +
        app.buildStatCard((t.unesco||[]).length,      "/ " + unesco.length + " UNESCO Sites") +
        app.buildStatCard((t.animals||[]).length,     "/ " + animals.length + " Animals");
    }).catch(function(err) { console.error(err); });
  </script>
</body>
</html>
