<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Overview - Ultimate Travel List</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="page-wrapper">
  <nav class="site-nav"><div class="nav-inner"></div></nav>
  <header class="page-hero">
    <h1>Family Overview</h1>
    <p>Everyone's progress at a glance</p>
    </header>
    <main>
      <div class="container">
        <a class="back-link" href="../index.html">Home</a>
        <section class="section">
          <h2 class="section-title">Progress Summary</h2>
          <div id="overviewSummary"><p class="loading-msg">Loading...</p></div>
        </section>
        <section class="section">
          <h2 class="section-title">Countries</h2>
          <div class="stats-grid" id="overviewCountries"></div>
        </section>
        <section class="section">
          <h2 class="section-title">Animals</h2>
          <div class="stats-grid" id="overviewAnimals"></div>
        </section>
        <section class="section">
          <h2 class="section-title">UNESCO Sites</h2>
          <div class="stats-grid" id="overviewUnesco"></div>
        </section>
        <section class="section">
          <h2 class="section-title">County Peaks</h2>
          <div class="stats-grid" id="overviewPeaks"></div>
        </section>
      </div>
    </main>
    <footer class="site-footer"><p>Ultimate Travel List 2026</p></footer>
    <script src="../js/travel.js"></script>
    <script>
      var app = window.TravelApp;
      app.renderNav('overview');
      app.loadAllData().then(function(d) {
              var tr=d.travellers,co=d.countries,an=d.animals,un=d.unesco,pk=d.peaks;
      var rows=[{label:'Countries',total:co.length,key:'countries'},{label:'Animals',total:an.length,key:'animals'},{label:'UNESCO Sites',total:un.length,key:'unesco'},{label:'County Peaks',total:pk.length,key:'county_peaks'}];
        var heads=tr.map(function(t){return '<th style="color:'+t.color+'">'+t.name+'</th>';}).join('');
        var tbody=rows.map(function(row){return '<tr><td>'+row.label+'</td><td>'+row.total+'</td>'+tr.map(function(t){var v=(t[row.key]||[]).length,p=Math.round(v/row.total*100);return '<td><strong style="color:'+t.color+'">'+v+'</strong> <span style="color:var(--color-muted);font-size:.75rem">('+p+'%)</span></td>';}).join('')+'</tr>';}).join('');
        document.getElementById('overviewSummary').innerHTML='<div style="overflow-x:auto"><table class="comparison-table"><thead><tr><th>Category</th><th>Total</th>'+heads+'</tr></thead><tbody>'+tbody+'</tbody></table></div>';
      function cards(id,key,total){document.getElementById(id).innerHTML=tr.map(function(t){var v=(t[key]||[]).length;return '<div class="stat-card"><span class="stat-number" style="color:'+t.color+'">'+v+'</span><span class="stat-label">'+t.name+' / '+total+'</span>'+app.buildProgressBar(v,total,t.id)+'</div>';}).join('');}
        cards('overviewCountries','countries',co.length);
        cards('overviewAnimals','animals',an.length);
        cards('overviewUnesco','unesco',un.length);
        cards('overviewPeaks','county_peaks',pk.length);
  }).catch(function(e){console.error(e);});
    </script>
  
  <!-- Auth Login Modal -->
  <div id="auth-modal-backdrop">
    <div id="auth-modal">
      <h3>&#128275; Edit Mode</h3>
      <p>Enter the password to enable editing</p>
      <input type="password" id="auth-password-input" placeholder="Password..." autocomplete="current-password">
      <div id="auth-error"></div>
      <div class="auth-modal-btns">
        <button id="auth-cancel-btn" onclick="document.getElementById('auth-modal-backdrop').classList.remove('open')">Cancel</button>
        <button id="auth-submit-btn">Unlock</button>
      </div>
    </div>
  </div>
  <script>
    function showLoginModal() {
      document.getElementById('auth-modal-backdrop').classList.add('open');
      document.getElementById('auth-password-input').value = '';
      document.getElementById('auth-error').textContent = '';
      setTimeout(function(){ document.getElementById('auth-password-input').focus(); }, 50);
    }
    document.addEventListener('DOMContentLoaded', function() {
      var submitBtn = document.getElementById('auth-submit-btn');
      var input = document.getElementById('auth-password-input');
      function tryLogin() {
        var pw = input.value;
        if (!pw) return;
        submitBtn.textContent = '...';
        authLogin(pw, function(ok) {
          if (ok) {
            document.getElementById('auth-modal-backdrop').classList.remove('open');
            window.location.reload();
          } else {
            document.getElementById('auth-error').textContent = 'Incorrect password';
            submitBtn.textContent = 'Unlock';
            input.value = '';
            input.focus();
          }
        });
      }
      submitBtn.addEventListener('click', tryLogin);
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });
    });
  </script>
</body>
</html>
