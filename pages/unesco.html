<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNESCO — Ultimate Travel List</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="page-wrapper">

  <nav class="site-nav"><div class="nav-inner"></div></nav>

  <header class="page-hero">
    <h1>&#127963; UNESCO World Heritage Sites</h1>
    <p>World Heritage Sites visited</p>
  </header>

  <main>
    <div class="container">

      <section class="section">
        <h2 class="section-title">UNESCO Progress by Traveller</h2>
        <div id="unescoTable"><p class="loading-msg">Loading...</p></div>
      </section>

    </div>
  </main>

  <footer class="site-footer"><p>Ultimate Travel List &copy; 2026</p></footer>

  <script src="../js/travel.js"></script>
  <script>
    var app = window.TravelApp;
    app.renderNav('unesco');
    app.loadAllData().then(function(data) {
      var travellers = data.travellers;
      var unesco     = data.unesco;
      var colours = { ben: '#4f8ef7', shaz: '#9b59f5', paul: '#3ecf8e', ruth: '#e05c8e' };
      var colTravellers = [];
      for (var i = 0; i < travellers.length; i++) {
        var t = travellers[i];
        colTravellers.push({ id: t.id, name: t.name, color: colours[t.id] || '#fff', unesco: t.unesco || [] });
      }
      app.renderComparisonTable({
        container: document.getElementById('unescoTable'),
        masterList: unesco,
        travellers: colTravellers,
        category: 'unesco',
        labelFn: function(i) { return i.name + ' (' + i.country + ')'; },
        groupFn: function(i) { return i.type; }
      });
    }).catch(function(err) { console.error(err); });
  </script>

</body>
</html>
